name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: "npm"

      - name: Setup uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install JS deps
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Sensor (ruff via uv)
        run: npm run sensor -- src/app.py

      - name: Eval 5/5
        run: npm run eval

      - name: Judge heuristic (no Ollama in CI, fallback)
        run: npm run judge -- src/app.py || echo "judge fallback ok"
