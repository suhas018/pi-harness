id: sample-01
goal: Add GET /health endpoint to FastAPI app that returns {status: "ok"}
files:
  - src/app.py
  - tests/test_health.py
verifier:
  - pytest -q tests/test_health.py
  - python -c "from fastapi.testclient import TestClient; from src.app import app; c=TestClient(app); assert c.get('/health').json()=={'status':'ok'}"
success: verifier exit 0
notes: Simple task to test harness loop + sensors + trajectory logging
