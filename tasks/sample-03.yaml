id: sample-03
goal: Add GET /items/{item_id} endpoint that returns {item_id: int, name: "item-{item_id}"} — validate item_id is int
files:
  - src/app.py
  - tests/test_items.py
verifier:
  - pytest -q tests/test_items.py
  - python -c "from fastapi.testclient import TestClient; from src.app import app; c=TestClient(app); assert c.get('/items/42').json()=={'item_id':42,'name':'item-42'}; assert c.get('/items/notanint').status_code==422"
success: verifier exit 0
notes: Tests path param validation. Reuses src/app.py.
